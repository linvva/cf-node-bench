name: Release applications

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  WAILS_VERSION: "v3.1.0"
  UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}

jobs:
  quality:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate update public key
        run: node -e 'if (Buffer.from(process.env.UPDATE_PUBLIC_KEY || "", "base64").length !== 32) throw new Error("Configure the UPDATE_PUBLIC_KEY repository variable before releasing")'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Generate desktop bindings
        run: wails3 generate bindings -ts -i -clean=true

      - name: Run Go tests
        run: go test ./...

      - name: Run frontend tests
        run: pnpm test

      - name: Run Telegram relay tests
        run: pnpm test:relay

      - name: Check frontend types
        run: pnpm typecheck

      - name: Install Playwright Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.arch }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            goos: windows
            arch: amd64
            suffix: windows-amd64.exe
          - os: windows-11-arm
            goos: windows
            arch: arm64
            suffix: windows-arm64.exe
          - os: ubuntu-24.04
            goos: linux
            arch: amd64
            suffix: linux-amd64
          - os: ubuntu-24.04-arm
            goos: linux
            arch: arm64
            suffix: linux-arm64
          - os: macos-15-intel
            goos: darwin
            arch: amd64
            suffix: macos-amd64.zip
          - os: macos-15
            goos: darwin
            arch: arm64
            suffix: macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Set executable version metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '').split('-')[0];
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid release tag');
          const path = 'build/windows/info.json';
          const info = JSON.parse(fs.readFileSync(path, 'utf8'));
          info.fixed.file_version = info.fixed.product_version = version;
          info.info['0409'].FileVersion = info.info['0409'].ProductVersion = version;
          fs.writeFileSync(path, JSON.stringify(info));
          for (const [file, pattern, value] of [
            ['build/windows/wails.exe.manifest', /(<assemblyIdentity[^>]*\bversion=")[^"]+/, `${version}.0`],
            ['build/darwin/Info.plist', /(<key>CFBundle(?:ShortVersionString|Version)<\/key>\s*<string>)[^<]+/g, version],
          ]) fs.writeFileSync(file, fs.readFileSync(file, 'utf8').replace(pattern, (_match, prefix) => prefix + value));
          NODE

      - name: Build application
        shell: bash
        run: wails3 build GOOS=${{ matrix.goos }} GOARCH=${{ matrix.arch }} VERSION="${GITHUB_REF_NAME#v}"

      - name: Verify architecture and prepare release file
        shell: bash
        run: |
          binary="build/bin/CF-Node-Bench${{ matrix.goos == 'windows' && '.exe' || '' }}"
          info="$(go version -m "$binary")"
          [[ "$info" == *"GOOS=${{ matrix.goos }}"* ]]
          [[ "$info" == *"GOARCH=${{ matrix.arch }}"* ]]
          mkdir -p release
          output="release/CF-Node-Bench-${GITHUB_REF_NAME}-${{ matrix.suffix }}"
          if [[ '${{ matrix.goos }}' == darwin ]]; then
            [[ "$(lipo -archs "$binary")" == '${{ matrix.arch == 'amd64' && 'x86_64' || 'arm64' }}' ]]
            wails3 task bundle:darwin
            ditto -c -k --norsrc --noextattr --keepParent build/bin/CF-Node-Bench.app "$output"
            [[ "$(zipinfo -1 "$output" | cut -d/ -f1 | sort -u)" == 'CF-Node-Bench.app' ]]
          else
            cp "$binary" "$output"
          fi

      - name: Upload release file
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.arch }}
          path: release/CF-Node-Bench-${{ github.ref_name }}-${{ matrix.suffix }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download release files
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Sign release files and generate manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: go run ./cmd/updatemanifest -dir release-artifacts -version "$GITHUB_REF_NAME" -repository "$GITHUB_REPOSITORY"

      - name: Generate SHA-256 checksums
        working-directory: release-artifacts
        run: sha256sum CF-Node-Bench-* update-manifest.json > SHA256SUMS.txt

      - name: Generate release notes from commits
        shell: bash
        run: |
          previous_tag="$(git describe --tags --match 'v*' --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          range="$GITHUB_SHA"
          if [[ -n "$previous_tag" ]]; then range="${previous_tag}..${GITHUB_SHA}"; fi
          {
            printf '## 更新内容\n\n'
            git log --reverse --format='### %s%n%n%b' "$range" | sed -E '/^(### |$)/!s/^/- /'
            printf '\n[下载与使用说明](https://github.com/%s/blob/%s/docs/usage.md)\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
            if [[ -n "$previous_tag" ]]; then
              printf '\n**完整变更**：[%s…%s](https://github.com/%s/compare/%s...%s)\n' "$previous_tag" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$previous_tag" "$GITHUB_REF_NAME"
            fi
          } > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          body_path: release-notes.md
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
